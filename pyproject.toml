[project]
name = "llm-sdk"
version = "0.1.0"
description = "LLM SDK for local model inference"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "huggingface-hub",
    "accelerate",
    "pydantic"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]

[tool.mypy]
ignore_missing_imports = true
allow_subclassing_any = true
disallow_untyped_decorators = false
warn_return_any = false
plugins = [
    "pydantic.mypy"
]

# Force mypy to treat missing imports as Any without raising subclassing/decorator errors
[[tool.mypy.overrides]]
module = [
    "pydantic.*",
    "torch.*",
    "transformers.*",
    "huggingface_hub.*"
]
ignore_missing_imports = true
